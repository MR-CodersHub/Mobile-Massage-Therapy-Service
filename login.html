<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Serenova | Sign In to Your Wellness Account</title>
  <meta name="description" content="Sign in to your Serenova account to manage bookings, view session history, and access your personalized wellness dashboard.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none' stroke='%23C9A96E'><circle cx='20' cy='20' r='18' stroke-width='1.5'/><path d='M20 7C20 12.5 17 18 20 26C23 18 20 12.5 20 7Z' stroke-width='1.5'/><path d='M20 14.5C16.5 16 13 19 14.8 24.5C16.8 23.2 18.5 24.5 20 26' stroke-width='1.3'/><path d='M20 14.5C23.5 16 27 19 25.2 24.5C23.2 23.2 21.5 24.5 20 26' stroke-width='1.3'/><path d='M15 29C18 30.5 22 30.5 25 29' stroke-width='1.2'/><circle cx='20' cy='5' r='1' fill='%23C9A96E'/></svg>">
</head>
<body>

<main class="authx-page" id="login-page">
  <div class="authx-card" role="dialog" aria-labelledby="authx-login-title">
    <a class="authx-brand" href="index.html" aria-label="Serenova home">
      <div class="authx-brand-icon" aria-hidden="true"><svg class="brand-logo-mark" viewBox="0 0 40 40" width="28" height="28" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.55"/><circle cx="20" cy="20" r="15.5" stroke="currentColor" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.35"/><path d="M20 7C20 12.5 17 18 20 26C23 18 20 12.5 20 7Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 10V22" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.7"/><path d="M20 14.5C16.5 16 13 19 14.8 24.5C16.8 23.2 18.5 24.5 20 26" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 14.5C23.5 16 27 19 25.2 24.5C23.2 23.2 21.5 24.5 20 26" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 19C15.5 19.5 10.5 22 11.5 26.5C14.5 25.8 17.5 26 20 26" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 19C24.5 19.5 29.5 22 28.5 26.5C25.5 25.8 22.5 26 20 26" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 29C18 30.5 22 30.5 25 29" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8"/><circle cx="20" cy="4.8" r="0.9" fill="currentColor"/></svg></div>
      <span class="authx-brand-name">Serenova</span>
    </a>

    <h1 class="authx-title" id="authx-login-title">Welcome Back</h1>
    <p class="authx-sub">Sign in to continue to your account.</p>

    <form class="authx-form" id="auth-login-form" data-validate-form novalidate>
      <div class="form-group">
        <label class="form-label" for="auth-email">Email Address</label>
        <div class="input-icon-wrap">
          <span class="input-icon" aria-hidden="true"><svg class="icon icon-stroke" viewBox="0 0 24 24" width="18" height="18"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
          <input type="email" class="form-control" id="auth-email" name="email" placeholder="you@example.com" required data-validate="required email" autocomplete="email">
        </div>
        <span class="form-error" style="display:none;"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="auth-login-password">Password</label>
        <div class="input-icon-wrap authx-pw">
          <span class="input-icon" aria-hidden="true"><svg class="icon icon-stroke" viewBox="0 0 24 24" width="16" height="16"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" class="form-control" id="auth-login-password" name="password" placeholder="Enter your password" required data-validate="required password" autocomplete="current-password">
          <button type="button" class="authx-pw-toggle" data-auth-toggle aria-label="Show password" aria-pressed="false"><svg class="icon icon-stroke" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <span class="form-error" style="display:none;"></span>
      </div>

      <div class="authx-row">
        <label class="authx-check" for="auth-remember">
          <input type="checkbox" id="auth-remember" name="remember">
          <span>Remember me</span>
        </label>
        <a href="#" class="authx-link" id="auth-forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg authx-submit">Sign In</button>

      <div class="authx-divider">or continue with</div>

      <div class="authx-social">
        <a class="authx-social-btn" href="https://www.google.com" target="_blank" rel="noopener" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google
        </a>
        <a class="authx-social-btn" href="https://www.facebook.com" target="_blank" rel="noopener" aria-label="Continue with Facebook">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </a>
        <a class="authx-social-btn" href="https://www.apple.com" target="_blank" rel="noopener" aria-label="Continue with Apple">
          <svg viewBox="0 0 384 512" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          Apple
        </a>
      </div>

      <p class="authx-switch">Don&rsquo;t have an account? <a href="signup.html">Sign Up</a></p>
    </form>
  </div>

  <!-- Forgot password (frontend-only, reuses global modal system) -->
  <div class="modal-overlay" data-modal="auth-forgot">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-forgot-title">
      <div class="modal-header">
        <h3 class="modal-title" id="auth-forgot-title">Reset Your Password</h3>
        <button class="modal-close" data-modal-close aria-label="Close dialog"><svg class="icon icon-stroke" viewBox="0 0 24 24" width="18" height="18"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-mid);margin-bottom:1.5rem;font-size:0.9rem;">Enter your email address and we&rsquo;ll send you a secure reset link.</p>
        <form id="auth-reset-form" data-validate-form novalidate>
          <div class="form-group" style="margin-bottom:1.5rem;">
            <label class="form-label" for="auth-reset-email">Email Address</label>
            <div class="input-icon-wrap">
              <span class="input-icon" aria-hidden="true"><svg class="icon icon-stroke" viewBox="0 0 24 24" width="18" height="18"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
              <input type="email" class="form-control" id="auth-reset-email" name="email" placeholder="you@example.com" required data-validate="required email" autocomplete="email">
            </div>
            <span class="form-error" style="display:none;"></span>
          </div>
          <button type="submit" class="btn btn-primary w-full" style="justify-content:center;">Send Reset Link</button>
        </form>
      </div>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
