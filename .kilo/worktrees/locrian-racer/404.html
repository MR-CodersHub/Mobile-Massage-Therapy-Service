    .error-bg-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(18,59,58,0.06) 0%, transparent 70%);

    .error-bg-circle:nth-child(1) { width: 700px; height: 700px; top: -200px; left: -200px; }

      transition: opacity var(--tr-fast);

    .error-code {

      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 300;
      color: var(--teal-deep);
      line-height: 1;
      opacity: 0.12;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      user-select: none;
      z-index: 0;
      white-space: nowrap;
    }

    .error-illustration {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .error-title {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      color: var(--text-dark);
      margin-bottom: 1rem;
      font-weight: 400;
    }

    .error-message {

      color: var(--text-mid);
      line-height: 1.75;
      margin-bottom: 2.5rem;

      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-mid);
      background: var(--bg-card);
      transition: all var(--tr-fast);
    }

      border-color: var(--teal-light);
      color: var(--teal-deep);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
